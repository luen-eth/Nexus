[package]
name = "nexus-convert"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.88"
description = "Model conversion tool for Nexus - convert HuggingFace models to GGUF format"

[dependencies]
nexus = { path = "../..", default-features = false, features = ["cpu-simd"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "nexus-convert"
path = "main.rs"
