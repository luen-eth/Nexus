<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="738" viewBox="0 0 1280 738" role="img" aria-labelledby="title desc">
  <title id="title">How Nexus runs an inference request</title>
  <desc id="desc">CLI and HTTP requests are tokenized, scheduled by a dedicated worker with private session KV cache and RNG, then decoded to text or SSE. Dense projections use CPU AVX2/FMA with scalar fallback, or explicit CUDA with persistent weights and reusable device workspaces. Attention, normalization, RoPE and sampling remain on the CPU in both paths.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#748078" stroke-width="1.5"/></marker>
    <style>text{font-family:Inter,"DejaVu Sans",Arial,sans-serif}.label{font-size:20px;font-weight:700;fill:#1A2B23}.body{font-size:15px;fill:#52635B}.small{font-size:13px;fill:#69796F}.arrow{stroke:#748078;stroke-width:1.7;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect x="1" y="1" width="1278" height="736" rx="18" fill="#F7F9F6" stroke="#DAE1D9"/>
  <text x="48" y="62" font-size="30" font-weight="700" fill="#1A2B23">How a request runs</text>
  <text x="48" y="95" font-size="17" fill="#627168">Validated weights. Private sequence state. A selected projection backend.</text>
  <g transform="translate(48 132)">
    <rect width="242" height="124" rx="12" fill="#FFFFFF" stroke="#D5DED3"/>
    <text x="20" y="33" class="small">01 / ENTRY POINT</text>
    <text x="20" y="66" class="label">CLI or HTTP API</text>
    <text x="20" y="96" class="body">Text and chat requests</text>
  </g>
  <path d="M299 194H347" class="arrow"/>
  <g transform="translate(356 132)">
    <rect width="242" height="124" rx="12" fill="#FFFFFF" stroke="#D5DED3"/>
    <text x="20" y="33" class="small">02 / TOKENIZATION</text>
    <text x="20" y="66" class="label">HF JSON or GGUF</text>
    <text x="20" y="96" class="body">Model-aware templates</text>
  </g>
  <path d="M607 194H655" class="arrow"/>
  <g transform="translate(664 132)">
    <rect width="242" height="124" rx="12" fill="#EAF1E5" stroke="#AFC3A2"/>
    <text x="20" y="33" class="small">03 / INFERENCE</text>
    <text x="20" y="66" class="label">Session worker</text>
    <text x="20" y="96" class="body">Token-by-token scheduling</text>
  </g>
  <path d="M915 194H963" class="arrow"/>
  <g transform="translate(972 132)">
    <rect width="260" height="124" rx="12" fill="#FFFFFF" stroke="#D5DED3"/>
    <text x="20" y="33" class="small">04 / RESPONSE</text>
    <text x="20" y="66" class="label">Text or SSE</text>
    <text x="20" y="96" class="body">Decode, stop and finish</text>
  </g>
  <path d="M785 256V282" stroke="#A3B49D" stroke-width="1.7" stroke-dasharray="5 5"/>
  <rect x="48" y="282" width="1184" height="332" rx="16" fill="#FFFFFF" stroke="#CBD7C5"/>
  <text x="72" y="320" font-size="13" font-weight="700" letter-spacing="1.8" fill="#6A7A62">INSIDE THE INFERENCE WORKER</text>
  <g transform="translate(72 348)">
    <rect width="320" height="236" rx="12" fill="#F3F6F0"/>
    <text x="22" y="36" class="label">Shared CPU work</text>
    <text x="22" y="76" class="body">Normalization and RoPE</text>
    <text x="22" y="106" class="body">Attention and KV storage</text>
    <text x="22" y="136" class="body">Sampling and stop checks</text>
    <path d="M22 158H298" stroke="#D9E1D3"/>
    <text x="22" y="187" font-size="15" font-weight="600" fill="#3F5945">Every session owns its</text>
    <text x="22" y="210" font-size="15" fill="#52635B">KV cache and sampling RNG.</text>
  </g>
  <path d="M409 458H443" class="arrow"/>
  <g transform="translate(454 348)">
    <rect width="342" height="105" rx="12" fill="#192F23"/>
    <text x="20" y="32" font-size="18" font-weight="700" fill="#DDEFD4">CPU dense projections</text>
    <text x="20" y="62" font-size="15" fill="#BDCFB8">AVX2/FMA or ordered scalar</text>
    <text x="20" y="85" font-size="14" fill="#A1B59D">Optional private row-parallel pool</text>
  </g>
  <g transform="translate(454 477)">
    <rect width="342" height="107" rx="12" fill="#1B2C41"/>
    <text x="20" y="32" font-size="18" font-weight="700" fill="#DEEBFF">CUDA dense projections</text>
    <text x="20" y="62" font-size="15" fill="#BFCFE5">Persistent F32 device weights</text>
    <text x="20" y="86" font-size="14" fill="#A1B6D1">Reused input/output workspaces</text>
  </g>
  <text x="852" y="384" class="label">One backend per model</text>
  <text x="852" y="418" class="body">CPU is the default.</text>
  <text x="852" y="445" class="body">CUDA is selected explicitly.</text>
  <path d="M852 468H1206" stroke="#DCE3D7"/>
  <text x="852" y="498" font-size="15" font-weight="600" fill="#3F5945">CUDA remains hybrid:</text>
  <text x="852" y="524" class="body">each projection copies its input</text>
  <text x="852" y="550" class="body">and result across CPU and GPU.</text>
  <rect x="48" y="642" width="1184" height="60" rx="10" fill="#EAF0E5"/>
  <text x="70" y="679" font-size="16" fill="#41513D">GGUF / safetensors</text>
  <path d="M255 672H294" class="arrow"/>
  <text x="311" y="679" font-size="16" fill="#41513D">Convert and validate</text>
  <path d="M503 672H542" class="arrow"/>
  <text x="559" y="679" font-size="16" fill="#41513D">Materialize runtime weights as F32</text>
  <text x="988" y="679" font-size="13" fill="#6B7C63">File size ≠ RAM / VRAM size</text>
</svg>
