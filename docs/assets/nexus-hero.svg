  <path d="M841 110V115M848 110V115M855 110V115M841 136V141M848 136V141M855 136V141M833 118H838M833 125H838M833 132H838M859 118H864M859 125H864M859 132H864" stroke="#BAED8A" stroke-width="1.5"/>
  <text x="890" y="124" fill="#DDF2D5" font-size="24" font-weight="700">CPU</text>
  <text x="890" y="151" fill="#B5D3B3" font-size="16">AVX2 / FMA + scalar fallback</text>
  <text x="824" y="182" fill="#9DB5A5" font-size="14">Portable default · optional thread control</text>
