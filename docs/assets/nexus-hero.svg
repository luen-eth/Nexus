  <path d="M736 224V142H791" fill="none" stroke="#72978B" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="644" cy="224" r="5" fill="#BAED8A"/><circle cx="736" cy="224" r="4" fill="#101B18" stroke="#72978B" stroke-width="2"/>
