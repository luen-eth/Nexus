<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="title desc">
  <title id="title">Nexus — local inference in Rust</title>
  <desc id="desc">A Rust GGUF runtime with a default CPU path using AVX2/FMA or scalar execution and an explicitly selected NVIDIA CUDA path. Both use F32 runtime weights.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101B18"/><stop offset="1" stop-color="#0E151E"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#CFDFD9" stroke-opacity=".035"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#72978B" stroke-width="1.5"/></marker>
    <style>text{font-family:Inter,"DejaVu Sans",Arial,sans-serif}.mono{font-family:"DejaVu Sans Mono",monospace}.muted{fill:#A9BBB5}</style>
  </defs>
  <rect width="1280" height="448" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="448" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="446" rx="19" fill="none" stroke="#2F413B"/>
  <path d="M64 76V46L88 76V46" fill="none" stroke="#BAED8A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="108" y="68" font-size="14" letter-spacing="2.3" fill="#AFC3BA">RUST · GGUF · LOCAL INFERENCE</text>
  <text x="60" y="188" font-size="92" font-weight="700" letter-spacing="-5" fill="#F2F7F3">Nexus</text>
  <text x="66" y="242" font-size="26" fill="#DAE5DF">Local models. Explicit execution.</text>
  <text x="66" y="278" font-size="19" class="muted">CPU by default. CUDA when selected.</text>
  <rect x="66" y="314" width="108" height="31" rx="15.5" fill="#21382B" stroke="#4D6A43"/>
  <circle cx="82" cy="329.5" r="4" fill="#BAED8A"/>
  <text x="94" y="335" font-size="13" fill="#D4EFC2">Prototype</text>
  <text x="192" y="335" font-size="14" class="muted">F32 runtime weights · Apache-2.0</text>
  <text x="66" y="399" font-size="15" fill="#93ADA2">CLI</text><circle cx="107" cy="394" r="2" fill="#566F64"/>
  <text x="123" y="399" font-size="15" fill="#93ADA2">OpenAI-compatible HTTP API</text><circle cx="370" cy="394" r="2" fill="#566F64"/>
  <text x="386" y="399" font-size="15" fill="#93ADA2">Model conversion</text>
